version: "3.9"

services:

  backend:
    build: ./backend
    container_name: smartshop-backend
    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    restart: always

  frontend:
    build: ./frontend
    container_name: smartshop-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: always